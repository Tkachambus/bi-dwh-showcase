name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in sql/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
        env:
          PGPASSWORD: pulse
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r etl/requirements.txt
      - run: python etl/seed.py
      - run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build:static
        working-directory: app
        env:
          STATIC_SNAPSHOT: "1"
